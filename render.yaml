databases:
  - name: bedcare01-db
    databaseName: bedcare01
    user: bedcare01
    plan: basic-256mb
    region: frankfurt
    ipAllowList: []

services:
  - type: web
    name: bedcare01-web
    runtime: node
    region: frankfurt
    plan: starter
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm db:generate && pnpm build
    preDeployCommand: pnpm db:deploy
    startCommand: pnpm start
    healthCheckPath: /healthz
    maxShutdownDelaySeconds: 30
    autoDeployTrigger: commit
    envVars: &appEnv
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: bedcare01-db
          property: connectionString
      - key: SHOPIFY_API_KEY
        sync: false
      - key: SHOPIFY_API_SECRET
        sync: false
      - key: SHOPIFY_APP_URL
        sync: false
      - key: SHOPIFY_SCOPES
        value: write_draft_orders,read_draft_orders,read_customers,write_customers
      - key: SESSION_SECRET
        generateValue: true
      - key: EMAIL_PROVIDER
        value: preview
      - key: EMAIL_FROM
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: OBJECT_STORAGE_ENDPOINT
        sync: false
      - key: OBJECT_STORAGE_REGION
        sync: false
      - key: OBJECT_STORAGE_BUCKET
        sync: false
      - key: OBJECT_STORAGE_ACCESS_KEY_ID
        sync: false
      - key: OBJECT_STORAGE_SECRET_ACCESS_KEY
        sync: false
      - key: IMAGE_PROVIDER
        value: disabled
      - key: IMAGE_API_KEY
        sync: false
      - key: IMAGE_MODEL
        sync: false
      - key: WORKER_POLL_INTERVAL_MS
        value: "2000"

  - type: worker
    name: bedcare01-worker
    runtime: node
    region: frankfurt
    plan: starter
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm db:generate
    startCommand: pnpm worker
    maxShutdownDelaySeconds: 120
    autoDeployTrigger: commit
    envVars: *appEnv
